<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音楽再生 試作</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --sub: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --danger: #f87171;
  }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    text-align: center;
  }
  h1 { font-size: 1.05rem; margin-bottom: 0.4rem; }
  .sub { font-size: 0.8rem; color: var(--sub); margin-bottom: 1.25rem; }
  button {
    width: 100%;
    padding: 0.75rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin-top: 0.9rem; font-size: 0.8rem; color: var(--sub); min-height: 1.2em; }
  #status.error { color: var(--danger); }
  /* プレーヤーは画面外に置く（映像は見せず、音だけ再生する）。
     display:none や 0×0 にすると再生が止められることがあるため、最小サイズで画面外に配置している */
  #player-wrap { position: fixed; left: -9999px; top: 0; width: 200px; height: 200px; }
</style>
</head>
<body>

  <main>
    <h1>音楽再生の試作</h1>
    <p class="sub">ボタンを押すと音楽が流れます</p>
    <button id="play-btn" onclick="onPlayClick()" disabled>読み込み中…</button>
    <div id="status"></div>
  </main>

  <div id="player-wrap"><div id="yt-player"></div></div>

<script>
  const VIDEO_ID = "y-abO0PMZAY";

  let player = null;
  let playerReady = false;
  let isPlaying = false;

  const btn = document.getElementById("play-btn");
  const statusEl = document.getElementById("status");

  function setStatus(text, isError = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle("error", isError);
  }

  // YouTube IFrame API の読み込み
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = () => {
    btn.textContent = "再生できません";
    setStatus("YouTubeの読み込みに失敗しました。通信状況を確認してください。", true);
  };
  document.head.appendChild(tag);

  // API読み込み完了時にYouTubeが自動で呼ぶ関数
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("yt-player", {
      videoId: VIDEO_ID,
      width: 200,
      height: 200,
      playerVars: { playsinline: 1, rel: 0, controls: 0 },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onError: onPlayerError,
      },
    });
  }

  function onPlayerReady() {
    playerReady = true;
    btn.disabled = false;
    btn.textContent = "▶ 音楽を再生";
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      isPlaying = true;
      btn.textContent = "⏸ 一時停止";
      setStatus("再生中");
    } else if (e.data === YT.PlayerState.PAUSED) {
      isPlaying = false;
      btn.textContent = "▶ 音楽を再生";
      setStatus("一時停止中");
    } else if (e.data === YT.PlayerState.ENDED) {
      isPlaying = false;
      btn.textContent = "▶ もう一度再生";
      setStatus("再生が終わりました");
    }
  }

  function onPlayerError(e) {
    // 2: 動画IDが不正 / 5: HTML5プレーヤーのエラー / 100: 動画が見つからない・非公開
    // 101, 150: 埋め込み再生が許可されていない / 153: 埋め込み元情報(Referer)がない
    const messages = {
      2:   "動画の指定が正しくありません。",
      5:   "プレーヤーでエラーが発生しました。",
      100: "動画が見つからないか、非公開です。",
      101: "この動画は埋め込み再生が許可されていません。",
      150: "この動画は埋め込み再生が許可されていません。",
      153: "埋め込み元の情報が取得できませんでした。ファイルを直接開かず、Webサーバー経由（http:// や https://）で開いてください。",
    };
    btn.disabled = true;
    btn.textContent = "再生できません";
    setStatus((messages[e.data] || "再生できませんでした。") + `（エラー ${e.data}）`, true);
  }

  // ボタンを押したときに再生する（ユーザー操作の中で再生を開始するので、自動再生制限にかからない）
  function onPlayClick() {
    if (!playerReady) return;
    if (isPlaying) {
      player.pauseVideo();
    } else {
      player.unMute();
      player.setVolume(100);
      player.playVideo();
    }
  }
</script>
</body>
</html>
